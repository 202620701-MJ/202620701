<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The D-Day Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ===== 워헤이븐 서체 (넥슨코리아 무료 서체: 개인·기업 상업적 이용 가능, 임베딩 허용) =====
     저작권 안내: 제공되는 서체의 지적 재산권을 포함한 모든 권리는 (주)넥슨코리아에 있습니다.
     출처: https://brand.nexon.com/ko/ci-brand-guidelines/typeface */
  @font-face {
    font-family: 'NexonWarhaven';
    src: url('fonts/WarhavenR.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2312-1@1.1/WarhavenR.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }

  @font-face {
    font-family: 'NexonWarhaven';
    src: url('fonts/WarhavenB.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2312-1@1.1/WarhavenB.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }

  body {
    font-family: 'NexonWarhaven', 'Noto Serif KR', Georgia, 'Times New Roman', serif;
    background: #fff;
    color: #121212;
    min-height: 100vh;
    padding: 32px 16px 64px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
  }

  /* ===== 마스트헤드 ===== */
  .masthead {
    text-align: center;
    border-top: 1px solid #121212;
    padding-top: 14px;
  }

  .masthead h1 {
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: .01em;
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .double-rule {
    height: 5px;
    border-top: 3px solid #121212;
    border-bottom: 1px solid #121212;
  }

  .today-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 2px;
    border-bottom: 1px solid #e2e2e2;
    font-size: .8rem;
    color: #555;
    letter-spacing: .04em;
  }

  .today-line .section {
    text-transform: uppercase;
    font-weight: 700;
    color: #121212;
  }

  /* ===== 상단 고정 배너 (마스트헤드 바로 아래) ===== */
  .banner-tagline {
    text-align: center;
    font-size: .95rem;
    color: #727272;
    margin: 28px 0 22px;
  }

  .pinned-banner { margin-top: 16px; }

  .pinned-banner-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: #121212;
    padding-bottom: 8px;
    border-bottom: 2px solid #121212;
  }

  .pinned-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 2px;
    border-bottom: 1px solid #e2e2e2;
  }

  .pinned-info { flex: 1; min-width: 0; }

  .pinned-title {
    font-size: 1.08rem;
    font-weight: 700;
    color: #121212;
    line-height: 1.4;
    word-break: break-all;
  }

  .pinned-date {
    font-size: .78rem;
    color: #727272;
    margin-top: 3px;
    letter-spacing: .03em;
  }

  .pinned-banner .dday-badge {
    min-width: 76px;
    font-size: 1.15rem;
    gap: 5px;
  }

  .pinned-banner .dday-bar { height: 3px; }

  /* ===== 입력 영역 ===== */
  .input-card {
    border-top: 2px solid #121212;
    border-bottom: 1px solid #e2e2e2;
    padding: 20px 2px 22px;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .input-label {
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: #727272;
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  input[type="text"], input[type="date"] {
    flex: 1;
    padding: 12px 12px;
    border: 1px solid #cccccc;
    border-radius: 0;
    font-size: 1rem;
    font-family: inherit;
    background: #fff;
    color: #121212;
    outline: none;
    transition: border-color .15s;
  }

  input[type="text"]:focus, input[type="date"]:focus {
    border-color: #121212;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 0;
    font-size: .85rem;
    font-weight: 700;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: .1em;
    transition: background .15s, color .15s;
  }

  button:active { opacity: .85; }

  .add-btn {
    background: #121212;
    color: #fff;
    padding: 12px 26px;
    white-space: nowrap;
  }

  .add-btn:hover { background: #333; }

  /* ===== 게시물 목록 ===== */
  .sort-info {
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: #727272;
    margin: 26px 0 0;
    padding-bottom: 8px;
    border-bottom: 2px solid #121212;
  }

  .post-list {
    display: flex;
    flex-direction: column;
  }

  .empty {
    text-align: center;
    color: #727272;
    padding: 48px 20px;
    border-bottom: 1px solid #e2e2e2;
    font-size: 1rem;
    line-height: 1.7;
  }

  .post {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px 10px;
    border-bottom: 1px solid #e2e2e2;
  }

  /* 새로 등록된 게시물만 부드럽게 등장 — 나머지 게시물은 항상 선명하게 유지 */
  .post.just-added { animation: fadeIn .35s ease; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .dday-badge {
    min-width: 96px;
    text-align: center;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: .01em;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .dday-badge.future,
  .dday-badge.past { color: #121212; }
  .dday-badge.today { color: #b00; }

  /* 임박도 밑줄: 초록 → 빨강 */
  .dday-bar {
    width: 100%;
    height: 4px;
    background: #ececec;
  }

  .dday-fill {
    height: 100%;
    transition: width .3s ease, background .3s ease;
  }

  .post-info {
    flex: 1;
    min-width: 0;
  }

  .post-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 1.2rem;
    font-weight: 700;
    color: #121212;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .title-text { word-break: break-all; }

  /* 핀 버튼: 평소 옅은 회색, 고정 시 검정 */
  .pin-btn {
    background: transparent;
    color: #d9d9d9;
    padding: 2px 3px;
    flex-shrink: 0;
    letter-spacing: 0;
    text-transform: none;
    line-height: 0;
    align-self: center;
  }

  .pin-btn:hover { color: #8a8a8a; }

  .pin-btn.is-pinned { color: #121212; }

  .post-date {
    font-size: .82rem;
    color: #727272;
    letter-spacing: .03em;
  }

  .post-desc {
    font-size: .85rem;
    color: #555;
    margin-top: 2px;
  }

  .delete-btn {
    background: transparent;
    color: #b3b3b3;
    font-size: 1.1rem;
    padding: 6px 8px;
    flex-shrink: 0;
    letter-spacing: 0;
  }

  .delete-btn:hover { color: #b00; }

  /* ===== 하단 ===== */
  footer {
    margin-top: 40px;
    padding-top: 10px;
    border-top: 3px solid #121212;
    text-align: center;
    font-size: .75rem;
    color: #9a9a9a;
    letter-spacing: .06em;
  }

  @media (max-width: 480px) {
    .masthead h1 { font-size: 2rem; }
    .input-row { flex-direction: column; }
    .add-btn { width: 100%; padding: 13px; }
    .dday-badge { min-width: 74px; font-size: 1.35rem; }
    .post { gap: 12px; }
    .pinned-item { gap: 10px; }
    .pinned-banner .dday-badge { min-width: 62px; font-size: 1rem; }
  }
</style>
</head>
<body>
  <div class="container">

    <header class="masthead">
      <h1>The D-Day Times</h1>
      <div class="double-rule"></div>
      <div class="today-line">
        <span class="section">D-Day 게시판</span>
        <span id="todayLine"></span>
      </div>
    </header>

    <div id="topBanner"></div>

    <div class="input-card">
      <label class="input-label" for="titleInput">제목 등록</label>
      <input type="text" id="titleInput" placeholder="무엇인가요? (예: 전역일, 시험, 생일)" maxlength="50">
      <label class="input-label" for="dateInput">날짜 등록</label>
      <div class="input-row">
        <input type="date" id="dateInput">
        <button class="add-btn" onclick="addPost()">게시하기</button>
      </div>
    </div>

    <div class="post-list" id="postList"></div>

    <footer>The D-Day Times &middot; 오늘의 날짜를 기준으로 매일 자동 계산됩니다<br>서체: 넥슨 워헤이븐 &copy; (주)넥슨코리아</footer>
  </div>

<script>
  const STORAGE_KEY = 'dday-posts';
  let lastAddedId = null; // 새로 등록된 게시물만 페이드인 적용용

  function loadPosts() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function savePosts(posts) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  }

  // 날짜 간 일수 차이 (자정 기준)
  function diffDays(target) {
    const today = new Date();
    const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const t1 = new Date(target.getFullYear(), target.getMonth(), target.getDate());
    return Math.round((t1 - t0) / 86400000);
  }

  function getDdayInfo(dateStr) {
    const target = parseDate(dateStr);
    const diff = diffDays(target);

    if (diff > 0) {
      return { type: 'future', label: 'D-' + diff, desc: diff + '일 남았어요' };
    } else if (diff === 0) {
      return { type: 'today', label: 'D-DAY', desc: '바로 오늘이에요' };
    } else {
      return { type: 'past', label: 'D+' + Math.abs(diff), desc: Math.abs(diff) + '일 지났어요' };
    }
  }

  function addPost() {
    const titleEl = document.getElementById('titleInput');
    const dateEl = document.getElementById('dateInput');
    const title = titleEl.value.trim();
    const date = dateEl.value;

    if (!title) { alert('무엇인지 입력해 주세요.'); titleEl.focus(); return; }
    if (!date) { alert('날짜를 선택해 주세요.'); dateEl.focus(); return; }

    const posts = loadPosts();
    const id = Date.now();
    posts.push({ id: id, title: title, date: date, pinned: false });
    lastAddedId = id;
    savePosts(posts);

    titleEl.value = '';
    render();
    lastAddedId = null;
    titleEl.focus();
  }

  function deletePost(id) {
    if (!confirm('이 게시물을 삭제할까요?')) return;
    const posts = loadPosts().filter(p => p.id !== id);
    savePosts(posts);
    render();
  }

  // 핀 고정 게시물은 마스트헤드 바로 아래 상단 배너에 고정 표시,
  // 일반 게시물은 목록에 D-Day 가까운(절대값 기준) 순으로 정렬
  function render() {
    const all = loadPosts();
    const byProximity = (a, b) =>
      Math.abs(diffDays(parseDate(a.date))) - Math.abs(diffDays(parseDate(b.date)));

    const pinned = all.filter(p => p.pinned).sort(byProximity);
    const normal = all.filter(p => !p.pinned).sort(byProximity);

    renderBanner(pinned);

    const listEl = document.getElementById('postList');

    if (all.length === 0) {
      listEl.innerHTML = '<div class="empty">아직 게시물이 없습니다.<br>위에서 첫 D-DAY를 등록해 보세요.</div>';
      return;
    }

    if (normal.length === 0) {
      listEl.innerHTML = '';
      return;
    }

    listEl.innerHTML = sectionLabel('게시물') + normal.map(postCard).join('');
  }

  // 상단 배너: 고정 게시물이 없으면 안내 문구 표시
  function renderBanner(pinned) {
    const bannerEl = document.getElementById('topBanner');

    if (pinned.length === 0) {
      bannerEl.innerHTML = '<p class="banner-tagline">중요한 날짜를 게시하면 남은 날 또는 지난 날을 계산해 드립니다</p>';
      return;
    }

    bannerEl.innerHTML = `
      <div class="pinned-banner">
        <div class="pinned-banner-label">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
          고정 게시물
        </div>
        ${pinned.map(bannerCard).join('')}
      </div>`;
  }

  function bannerCard(p) {
    const info = getDdayInfo(p.date);
    const bar = urgencyBar(p.date);
    const [y, m, d] = p.date.split('-');
    const dateText = `${y}. ${m}. ${d} (${weekdayOf(p.date)})`;
    return `
      <div class="pinned-item">
        <div class="pinned-info">
          <div class="pinned-title">${escapeHtml(p.title)}</div>
          <div class="pinned-date">${dateText} &middot; ${info.desc}</div>
        </div>
        <div class="dday-badge ${info.type}">
          <span>${info.label}</span>
          <div class="dday-bar"><div class="dday-fill" style="width:${bar.width}%;background:${bar.color}"></div></div>
        </div>
        <button class="pin-btn is-pinned" onclick="togglePin(${p.id})" title="고정 해제" aria-label="고정 해제">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
        </button>
        <button class="delete-btn" onclick="deletePost(${p.id})" title="삭제">✕</button>
      </div>`;
  }

  function sectionLabel(text) {
    return `<div class="sort-info">${text}</div>`;
  }

  function postCard(p) {
    const info = getDdayInfo(p.date);
    const bar = urgencyBar(p.date);
    const [y, m, d] = p.date.split('-');
    const dateText = `${y}. ${m}. ${d} (${weekdayOf(p.date)})`;
    const pinTitle = p.pinned ? '고정 해제' : '중요 게시물 고정';
    const justAdded = p.id === lastAddedId ? ' just-added' : '';
    return `
      <div class="post ${info.type}${justAdded}">
        <div class="dday-badge ${info.type}">
          <span>${info.label}</span>
          <div class="dday-bar"><div class="dday-fill" style="width:${bar.width}%;background:${bar.color}"></div></div>
        </div>
        <div class="post-info">
          <div class="post-title">
            <span class="title-text">${escapeHtml(p.title)}</span>
            <button class="pin-btn${p.pinned ? ' is-pinned' : ''}" onclick="togglePin(${p.id})" title="${pinTitle}" aria-label="${pinTitle}">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
            </button>
          </div>
          <div class="post-date">${dateText}</div>
          <div class="post-desc">${info.desc}</div>
        </div>
        <button class="delete-btn" onclick="deletePost(${p.id})" title="삭제">✕</button>
      </div>`;
  }

  // 임박도 밑줄: 남은 일수에 따라 초록(여유) → 빨강(임박), 길이는 경과 비율
  function urgencyBar(dateStr) {
    const left = diffDays(parseDate(dateStr));
    if (left < 0)  return { width: 100, color: '#121212' };
    if (left === 0) return { width: 100, color: 'hsl(0, 78%, 45%)' };
    const WINDOW = 100;
    const ratio = Math.min(left / WINDOW, 1);
    return {
      width: Math.max(100 - ratio * 100, 3),
      color: `hsl(${Math.round(140 * ratio)}, 75%, 42%)`
    };
  }

  function togglePin(id) {
    const posts = loadPosts().map(p => p.id === id ? Object.assign({}, p, { pinned: !p.pinned }) : p);
    savePosts(posts);
    render();
  }

  function parseDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function weekdayOf(dateStr) {
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    return days[parseDate(dateStr).getDay()];
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderTodayLine() {
    const today = new Date();
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const text = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일 ${days[today.getDay()]}요일`;
    document.getElementById('todayLine').textContent = text;
  }

  document.getElementById('dateInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addPost();
  });
  document.getElementById('titleInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('dateInput').focus();
  });

  renderTodayLine();
  render();
</script>
</body>
</html>
